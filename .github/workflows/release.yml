name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for artifacts (e.g. 0.1.0); ignored on tag pushes'
        required: false
        default: '0.0.0-ci'

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RAW=${GITHUB_REF#refs/tags/}
            VERSION=${RAW#v}
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version=$VERSION"

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/ChromaLab/ChromaLab.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:UseLocalChromaFx=false \
            -p:Version="${{ steps.ver.outputs.VERSION }}" \
            -o "publish/${{ matrix.rid }}"

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "publish/${{ matrix.rid }}\*" `
            -DestinationPath "ChromaLab-${{ steps.ver.outputs.VERSION }}-${{ matrix.rid }}.zip"

      - name: Zip (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          (cd "publish/${{ matrix.rid }}" && zip -r "../../ChromaLab-${{ steps.ver.outputs.VERSION }}-${{ matrix.rid }}.zip" .)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChromaLab-${{ steps.ver.outputs.VERSION }}-${{ matrix.rid }}
          path: ChromaLab-${{ steps.ver.outputs.VERSION }}-${{ matrix.rid }}.zip
          if-no-files-found: error

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
