name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ChromaLab.slnx -p:UseLocalChromaFx=false

      - name: Build
        run: dotnet build ChromaLab.slnx -c Release --no-restore -p:UseLocalChromaFx=false

      - name: Test
        run: >
          dotnet test tests/ChromaLab.Tests/ChromaLab.Tests.csproj
          -c Release --no-build -p:UseLocalChromaFx=false
          --verbosity minimal
